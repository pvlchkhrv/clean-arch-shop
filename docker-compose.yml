services:
  mongodb:
    image: mongo:latest
    container_name: shop-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
  postgres:
    image: postgres:latest
    container_name: shop-postgres
    environment:
      POSTGRES_DB: clean_shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
volumes:
  mongodb_data:
  postgres_data: